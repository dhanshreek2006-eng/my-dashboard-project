<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Inventory{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="/">Smart Inventory</a>
    <a class="btn btn-outline-light" href="/logout/">Logout</a>
</nav>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show m-3" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}
{% endif %}

<div class="container-fluid">
    <div class="row">

        <aside class="col-md-2 bg-light min-vh-100 p-3">
            <h5>Menu</h5>
            <a class="d-block mb-3" href="/dashboard/">Dashboard</a>
            <a class="d-block mb-3" href="/products/">Products</a>
            <a class="d-block mb-3" href="/categories/">Categories</a>
            <a class="d-block mb-3" href="/suppliers/">Suppliers</a>
            <a class="d-block mb-3" href="/purchases/">Purchases</a>
            <a class="d-block mb-3" href="/sales/">Sales</a>
            <a class="d-block mb-3" href="/analytics/">Analytics & Reports</a>
            <a class="d-block mb-3" href="/smart-insights/">Smart Insights</a>
        </aside>

        <main class="col-md-10 p-4">
            {% block content %}
            {% endblock %}
        </main>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
